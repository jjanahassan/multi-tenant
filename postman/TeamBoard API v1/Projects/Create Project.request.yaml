$kind: http-request
url: "{{base_url}}/api/v1/projects"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Postman Project",
      "description": "Created through Postman."
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Project created', function () {
          pm.response.to.have.status(201);
      });

      const json = pm.response.json();
      pm.collectionVariables.set('project_id', json.data.id);
    language: text/javascript
order: 2000
